<h2 class="sr-only">Sequence diagram showing how a user links a store: the app calls the backend, which checks the database for a duplicate NIF, validates the NIF with OBR, then saves the store.</h2>
<style>
#seq svg .messageText { font-size: 12px !important; }
#seq svg .actor { rx: 8; }
</style>
<div id="seq"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `sequenceDiagram
  participant U as Mobile app
  participant B as Backend API
  participant D as Database
  participant O as OBR API

  U->>B: POST /stores (name, NIF, town, phone)
  B->>D: Find store by NIF
  D-->>B: Existing store or none

  alt NIF already linked to another user
    B-->>U: 409 NIF already registered
  else NIF free
    B->>O: Check NIF / TIN
    alt NIF invalid or OBR unreachable
      O-->>B: Invalid or error
      B-->>U: 400 or 502 error
    else NIF valid
      O-->>B: Fiscal business name
      B->>D: Save store (name, NIF, fiscal name, town, phone, user_id)
      D-->>B: Store saved
      B-->>U: 201 store created
    end
  end`;
const { svg } = await mermaid.render('seq-svg', src);
document.getElementById('seq').innerHTML = svg;
</script>
