spring:
  application:
    name: backend-webm-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:backend_webm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-jwt-signing-key-dev-only}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  obr:
    username: ${OBR_USERNAME}
    password: ${OBR_PASSWORD}
    timeout-seconds: ${OBR_TIMEOUT_SECONDS:10}
  security:
    credentials-encryption-key: ${CREDENTIALS_ENCRYPTION_KEY:vQKq22ysSJnopHSb4ZLOf41DM2/2uRjkHmMaDx6EsuQ=}
